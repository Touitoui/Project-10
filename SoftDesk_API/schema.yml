components:
  schemas:
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        description:
          type: string
        issue:
          type: integer
        author:
          type: integer
          readOnly: true
        created_time:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_time
      - description
      - id
      - issue
    Contributor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        project:
          type: integer
        created_time:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_time
      - id
      - project
      - user
    Issue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 128
        description:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        project:
          type: integer
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        tag:
          $ref: '#/components/schemas/TagEnum'
        author:
          type: integer
          readOnly: true
        created_time:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_time
      - id
      - project
      - title
    PaginatedCommentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    PaginatedContributorList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Contributor'
    PaginatedIssueList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
    PaginatedProjectList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PatchedComment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        description:
          type: string
        issue:
          type: integer
        author:
          type: integer
          readOnly: true
        created_time:
          type: string
          format: date-time
          readOnly: true
    PatchedContributor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        project:
          type: integer
